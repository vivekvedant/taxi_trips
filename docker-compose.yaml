version: '3'

services:
  flask_app:
    container_name: flask_app
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.flask
      image: myapp_flask_app:latest
    ports:
      - "5000"
    command: gunicorn  wsgi:server --bind 0.0.0.0:5000



  ngnix:
    container_name: ngnix
    restart: always
    build:
      context: .
      dockerfile:  Dockerfile.ngnix
      image: myapp_nginx:latest
    ports:
      - "80:80"
    depends_on:
      - flask_app


